# Netlify: builds the Astro site (title page, docs) and the atlas together.
# site/scripts/prepare.mjs runs `python3 build.py` and copies dist/ into site/public/atlas/ first.
[build]
  base = "site"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.11"
